name: Materialize Geometry Assist source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize validated source
        run: |
          cat .bootstrap/payload-*.part > /tmp/geometryassist.tar.xz
          tar -xJf /tmp/geometryassist.tar.xz
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-source.yml
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Geometry Assist v0.14.14 validated baseline"
          git push
